services:
  - type: web
    name: np-intelligence-backend
    runtime: python
    rootDir: back
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: ENABLE_SCHEDULER
        value: true
      - key: SCAN_INTERVAL_MINUTES
        value: 60
      - key: DATABASE_PATH
        value: /var/data/np_intelligence.db
    disk:
      name: np-intelligence-data
      mountPath: /var/data
      sizeGB: 1

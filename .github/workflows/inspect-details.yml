name: Inspect NP relationship fields

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect-details.mjs"
      - ".github/workflows/inspect-details.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/inspect-details.mjs
        env:
          BACKEND_URL: ${{ vars.NP_BACKEND_URL }}

name: Deploy Cloudflare Worker

# Applies D1 migrations and deploys backend/. Needs a CLOUDFLARE_API_TOKEN repo
# secret (Workers + D1 edit) and, for some accounts, CLOUDFLARE_ACCOUNT_ID.
# Without the secret the job is skipped, so you can keep deploying by hand.
on:
  push:
    branches:
      - main
      - claude/zealous-rubin-6592oy
    paths:
      - "backend/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; skipping Worker deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20

      - name: Install wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npm ci

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npx wrangler deploy

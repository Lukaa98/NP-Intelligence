name: Deploy Cloudflare Worker

# Applies D1 migrations and deploys backend/. Needs a CLOUDFLARE_API_TOKEN repo
# secret (Workers + D1 edit) and, for some accounts, CLOUDFLARE_ACCOUNT_ID.
# Without the secret the job is skipped, so you can keep deploying by hand.
on:
  push:
    branches:
      - main
      - claude/zealous-rubin-6592oy
    paths:
      - "backend/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NP_ADMIN_TOKEN: ${{ secrets.NP_ADMIN_TOKEN }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; skipping Worker deploy."

      # Checked before anything touches the database. The site requires a
      # login; NP_ADMIN_TOKEN is the service key the archive job uses and
      # that guards creating the first admin account.
      - name: Require the NP_ADMIN_TOKEN secret
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ ${#NP_ADMIN_TOKEN} -lt 20 ]; then
            echo "::error::Add a repository secret NP_ADMIN_TOKEN (any random string, 20+ characters) before deploying."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20

      - name: Refuse to deploy a test NP endpoint
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: grep -q 'NP_API_URL = "https://np.ironhelmet.com/api"' backend/src/npApi.js

      - name: Install wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npm ci

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npx wrangler d1 migrations apply DB --remote

      - name: Set the Worker's ADMIN_TOKEN from NP_ADMIN_TOKEN
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: printf '%s' "$NP_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npx wrangler deploy
